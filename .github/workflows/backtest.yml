name: Backtest

# Run this by hand (Actions > Backtest > Run workflow), about once a week at most.
# It replays ~60 days of 5-minute Nifty candles, scores every technical indicator,
# and (only for strong, consistent edges) adjusts indicator weights by at most 50%.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nifty-monitor
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site && cd site
          git init -q -b data
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin data 2>/dev/null; then git checkout -q FETCH_HEAD -- . ; fi
          mkdir -p data

      - name: Run backtest
        env:
          DATA_DIR: site/data
        run: python -m src.backtest

      - name: Publish results
        run: |
          cp web/index.html site/index.html
          touch site/.nojekyll
          cd site
          git config user.name "nifty-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Backtest $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q --force origin HEAD:data
